# Project-wide Gradle settings for the KENKERN Engine.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Parallel project execution (single module today, keeps CI fast as modules grow).
org.gradle.parallel=true

# AndroidX is required.
android.useAndroidX=true

# Generate namespaced R classes only for the owning module.
android.nonTransitiveRClass=true

# Official Kotlin code style.
kotlin.code.style=official
