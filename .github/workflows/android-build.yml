name: Android Build

# Official KENKERN build process. CodeAssist is not part of this workflow.
# Builds Debug + Release APKs, runs JVM unit tests and uploads artifacts.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test + Debug APK + Release APK
    runs-on: ubuntu-latest

    env:
      KENKERN_KEYSTORE_BASE64: ${{ secrets.KENKERN_KEYSTORE_BASE64 }}
      KENKERN_KEYSTORE_PASSWORD: ${{ secrets.KENKERN_KEYSTORE_PASSWORD }}
      KENKERN_KEY_ALIAS: ${{ secrets.KENKERN_KEY_ALIAS }}
      KENKERN_KEY_PASSWORD: ${{ secrets.KENKERN_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub ubuntu-latest runners ship a preinstalled Android SDK
      # (ANDROID_HOME=/usr/local/lib/android/sdk). We accept licenses and
      # install the exact packages the build needs — no third-party setup
      # action, so the pipeline does not depend on its maintenance state.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional, from secrets)
        if: ${{ env.KENKERN_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KENKERN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kenkern-release.keystore"
          echo "KENKERN_KEYSTORE_PATH=$RUNNER_TEMP/kenkern-release.keystore" >> "$GITHUB_ENV"

      - name: Gradle validation + unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kenkern-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kenkern-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Report failure summary
        if: failure()
        run: |
          echo "### KENKERN Android build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "One or more steps above failed. Gradle ran with --stacktrace; check the failing step log for compiler or test errors." >> "$GITHUB_STEP_SUMMARY"
